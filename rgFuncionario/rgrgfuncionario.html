<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="rgfuncionario.css">
    <!-- FontAwesome para ícones modernos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="rgfuncionario.js?v=2"></script>

    <title>Gerenciar Funcionarios</title>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/home/home.html" class="logo"><img src="/img/logo.png" alt="logo"></a>
                <ul class="nav-links">
                <li class="user-greeting" style="color: var(--orange); font-family: 'Anton', sans-serif; font-size: 1.2rem; display: flex; align-items: center;"></li>
                <li><button class="nav-button" type="button" onclick="logout()">Sair</button></li>
            </ul>
        </div>
    </nav>
    <main>
        <header class="hero-section" style="padding: 40px 0 20px 0;">
            <div class="container hero-content">
                <h1 id="titulo1">Visão Geral</h1>
                <p>Gerencie informações dos Alunos e atualize detalhes dos Cursos oferecidos.</p>
            </div>
        </header>

        <section class="tabs-section container">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="openTab('tabAlunos')"><i class="fa-solid fa-users"></i> Alunos</button>
                <button class="tab-btn" onclick="openTab('tabCursos')"><i class="fa-solid fa-book-open"></i> Cursos</button>
            </div>

            <!-- CONTEÚDO DA ABA: ALUNOS -->
            <div id="tabAlunos" class="tab-content active">
                <div class="tab-top-actions">
                    <h2><i class="fa-solid fa-users-viewfinder"></i> Lista de Alunos</h2>
                    <button class="action-btn new-btn" onclick="abrirModalAluno()"><i class="fa-solid fa-user-plus"></i> Novo Aluno</button>
                </div>
                <div class="tabela-scroll">
                    <table class="tabela-alunos">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>RG</th>
                                <th>Idade</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="alunosTableBody">
                            <tr>
                                <th>Curso</th>
                                <th>Preço (R$)</th>
                                <th>C. Horária</th>
                                <th>Próxima Turma</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="cursosTableBody">
                            <!-- Inserido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ======================= MODAIS ======================= -->
        
        <!-- Modal: Cadastrar / Editar Aluno -->
        <div id="modalAluno" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header">
                    <h2 id="modalAlunoTitle">Adicionar Aluno</h2>
                    <button class="close-modal-btn" onclick="fecharModalAluno()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <form id="alunoForm">
                        <input type="hidden" id="alunoId">
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nome" required>
                            </div>
                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" required>
                            </div>
                            <div class="form-group">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" required>
                            </div>
                            <div class="form-group">
                                <label for="rg">RG</label>
                                <input type="text" id="rg" required>
                            </div>
                            <div class="form-group">
                                <label for="orgaoRg">Órgão Expedidor</label>
                                <input type="text" id="orgaoRg" required>
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone Principal</label>
                                <input type="text" id="telefone" required>
                            </div>
                            <div class="form-group">
                                <label for="telefoneAlt">Telefone Alternativo</label>
                                <input type="text" id="telefoneAlt">
                            </div>
                            <div class="form-group">
                                <label for="idade">Idade</label>
                                <input type="number" id="idade" min="0" required>
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label for="endereco">Endereço Completo</label>
                                <input type="text" id="endereco" required>
                            </div>
                        </div>

                        <hr class="form-divider">

                        <div class="form-grid pt-2">
                            <div class="form-group">
                                <label for="formaPagamento">Forma de Pagamento</label>
                                <input type="text" id="formaPagamento">
                            </div>
                            <div class="form-group">
                                <label for="cursoSolicitado">Curso Solicitado</label>
                                <input type="text" id="cursoSolicitado">
                            </div>
                            <div class="form-group">
                                <label for="dataInicio">Previsão Início</label>
                                <input type="date" id="dataInicio" required>
                            </div>
                            <div class="form-group">
                                <label>Turno</label>
                                <select id="turno" class="modern-select">
                                    <option value="">Selecione</option>
                                    <option value="Diurno">Diurno</option>
                                    <option value="Noturno">Noturno</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="modal-actions">
                            <button type="submit" class="action-btn save-btn"><i class="fa-solid fa-check"></i> Salvar Aluno</button>
                            <button type="button" class="action-btn cancel-btn" onclick="fecharModalAluno()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal: Editar Curso -->
        <div id="modalCurso" class="modal-overlay">
            <div class="modal-box small-modal">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-pen-to-square"></i> Editar Curso</h2>
                    <button class="close-modal-btn" onclick="fecharModalCurso()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <form id="cursoForm">
                        <input type="hidden" id="cursoId">
                        <div class="form-group">
                            <label for="cursoNome">Nome do Curso</label>
                            <input type="text" id="cursoNome" disabled class="disabled-input">
                        </div>
                        <div class="form-group">
                            <label for="cursoPreco">Valor Total (R$)</label>
                            <input type="text" id="cursoPreco" required placeholder="Ex: 600,00">
                        </div>
                        <div class="form-group">
                            <label for="cursoCargaHr">Carga Horária</label>
                            <input type="text" id="cursoCargaHr" required placeholder="Ex: 40 horas">
                        </div>
                        <div class="form-group">
                            <label for="cursoDataTurma">Próxima Turma</label>
                            <input type="text" id="cursoDataTurma" required placeholder="Ex: A definir">
                        </div>
                        <div class="modal-actions">
                            <button type="submit" class="action-btn save-btn"><i class="fa-solid fa-check"></i> Atualizar Curso</button>
                            <button type="button" class="action-btn cancel-btn" onclick="fecharModalCurso()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>
    <footer id="contato" class="footer-section">
        <div class="container footer-content">
            <div class="footer-info">
                <h4>Thémis</h4>
                <p>Rua da Segurança, 123 - Cidade Protetora</p>
                <p>contato@themis.com</p>
                <p>(11) 98765-4321</p>
            </div>
        </div>
    </footer>
    
</body>
</html>
