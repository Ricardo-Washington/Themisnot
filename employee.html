    <section class="register-section">
        <div class="register-container">
            <h1>Solicitação de cadastro de funcionário</h1>
            <p>Crie sua conta para que a secretaria possa validar seu acesso.</p>
            <form id="employeeRegisterForm" class="register-form">
                <div class="form-group"><label for="email">E-mail</label><input id="email" type="email" required></div>
                <div class="form-group"><label for="confirmEmail">Confirme o e-mail</label><input id="confirmEmail" type="email" required></div>
                <div class="form-group"><label for="password">Senha</label><input id="password" type="password" minlength="6" required></div>
                <div class="form-group"><label for="confirmPassword">Confirme a senha</label><input id="confirmPassword" type="password" minlength="6" required></div>
                <div class="form-group"><label for="nome">Nome completo</label><input id="nome" type="text" required></div>
                <button type="submit" class="cta-button">Enviar solicitação</button>
                <p id="employeeMessage" class="register-message" role="status"></p>
            </form>
        </div>
    </section>
