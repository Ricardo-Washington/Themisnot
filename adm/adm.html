<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adm.css">
    <link rel="stylesheet" href="/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config-shared.js" defer></script>
    <script src="adm.js" defer></script>
    <script src="/js/auth-guard.js" defer></script>
    <title>ADM</title>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/index/index.html" class="logo"><img src="/img/logo.png" alt="logo"></a>
            
                <ul class="nav-links">
                <li class="user-greeting" style="color: var(--orange); font-family: 'Anton', sans-serif; font-size: 1.2rem; display: flex; align-items: center;"></li>
                <li><a href="#contato">Contrato</a></li>
                <li><button class="nav-button" type="button" onclick="logout()">Sair</button></li>
            </ul>
        </div>
    </nav>

    <main>
        <header class="hero-section">
            <div class="container hero-content">
                <h1>Bem-vindo ADM</h1>
            </div>
        </header>
        <section id="dashboard-lists" class="dashboard-section">
            <div class="container admin-grid"> 
                <!-- Card de Funcionários -->
                <div class="admin-card">
                    <div class="card-header">
                        <h2><i class="fas fa-user-tie"></i> Funcionários</h2>
                    </div>
                    <ol id="dadosfuincionario" class="data-list"></ol>
                </div>
                
                <!-- Card de Alunos -->
                <div class="admin-card">
                    <div class="card-header">
                        <h2><i class="fas fa-user-graduate"></i> Alunos</h2>
                    </div>
                    <ol id="dadosaluno" class="data-list"></ol>
                </div>

                <!-- Card de Cursos -->
                <div class="admin-card">
                    <div class="card-header">
                        <h2><i class="fas fa-book"></i> Cursos</h2>
                    </div>
                    <ol id="dadoscursos" class="data-list"></ol>
                </div>
            </div>
        </section>

        <!-- Botões de Ação Global -->
        <div class="buttons-container admin-actions">
            <button class="action-btn" onclick="openModal('funcionario')"><i class="fas fa-pen"></i>Editar Funcionário</button>
            <button class="action-btn" onclick="openModal('aluno')"><i class="fas fa-pen"></i>Editar Aluno</button>
            <button class="action-btn" onclick="openModal('curso')"><i class="fas fa-pen"></i>Editar Curso</button>
            <button class="action-btn primary-btn" onclick="openModal('curso_novo')"><i class="fas fa-plus"></i> Novo Curso</button>
        </div>
    </main>

    <footer id="contato" class="footer-section">
        <div class="container footer-content">
            <div class="footer-info">
                <h4>Thémis</h4>
                <p>Rua da Segurança, 123 - Cidade Protetora</p>
                <p>contato@themis.com</p>
                <p>(11) 98765-4321</p>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
        <div class="footer-copyright">
            <p>&copy; 2025 Thémis. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Modal de edição -->
    <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2 id="modalTitle">Editar Registro</h2>
        <form id="editForm">
            <label class="requiredq">Selecione o registro</label>
            <select id="selectUsuario"></select>
            
            <div id="camposUsuario">
                <label class="requiredq">Nome </label>
                <input type="text" id="editNome" placeholder="Nome">
                <label class="requiredq">CPF </label>
                <input type="text" id="editCpf" placeholder="CPF">
                <label class="requiredq">Endereço </label>
                <input type="text" id="editEndereco" placeholder="Endereço">
                <label class="requiredq">Telefone </label>
                <input type="text" id="editTelefone" placeholder="Telefone">
                <label class="requiredq">RG </label>
                <input type="text" id="editRg" placeholder="RG">
                <label class="requiredq">Data de Nascimento </label>
                <input type="text" id="editNascimento" placeholder="Nascimento">
                <label class="requiredq">Atribuição </label>
                <select id="editAtribuicao">
                    <option value="funcionario">Funcionário</option>
                    <option value="aluno">Aluno</option>
                    <option value="adm">Administrador</option>
                </select>
            </div>

            <div id="camposCurso" style="display:none;">
                <label class="requiredq">Nome do Curso</label>
                <input type="text" id="editNomeCurso" placeholder="Nome do Curso...">
                <label class="requiredq">Valor do Curso (R$)</label>
                <input type="text" id="editPreco" placeholder="Ex: R$ 600,00">
                <label class="requiredq">Carga Horária</label>
                <input type="text" id="editCargaHr" placeholder="Ex: 40 horas">
                <label class="requiredq">Próxima Turma (Data)</label>
                <input type="text" id="editDataTurma" placeholder="Ex: 20/05/2026">
            </div>

            <button type="submit" class="details-button">Salvar</button>
            <button type="button" class="details-button" onclick="closeModal()">Cancelar</button>
            <button type="button" class="details-button" id="deleteButton" style="background:#c00;">Excluir</button>
        </form>
    </div>
</div>
</body>

</html>
