<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adm.css">
    <link rel="stylesheet" href="/global.css">
    <script src="adm.js" defer></script>
    <script src="/js/auth-guard.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>
    <title>ADM</title>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/index/index.html" class="logo"><img src="/img/logo.png" alt="logo"></a>
            <ul class="nav-links">
                <li><a href="#funcionarios">Lista de Funcionários</a></li>
                <li><a href="#cursos">Lista de Alunos</a></li>
                <li><a href="#contato">Contrato</a></li>
                <li><button class="nav-button" type="button" onclick="logout()">Sair</button></li>
            </ul>
        </div>
    </nav>

    <main>
        <header class="hero-section">
            <div class="container hero-content">
                <h1>Bem-vindo ADM</h1>
            </div>
        </header>
        <section id="Funcionarios" class="Funcionarios-section">
            <div class="titulos">
                <h2 class="section-title section-func">Lista Funcionarios</h2>
                <h2 class="section-title section-aluno">Lista Alunos</h2>
            </div>
            <div class="container"> 
                <div class="funcionario-item">
                    <ol id="dadosfuincionario">
                        <!-- Itens serão adicionados aqui via JavaScript -->
                    </ol>
                </div>
                <div class="alunos-item">
                    <ol id="dadosaluno">
                            <!-- Itens serão adicionados aqui via JavaScript -->
                    </ol>
                </div>
            </div>
        </section>
        <div class="buttons-container">
            <button class="details-button" onclick="openModal('funcionario')">Editar Funcionário</button>
            <button class="details-button" onclick="openModal('aluno')">Editar Aluno</button>
        </div>
    </main>

    <footer id="contato" class="footer-section">
        <div class="container footer-content">
            <div class="footer-info">
                <h4>Thémis</h4>
                <p>Rua da Segurança, 123 - Cidade Protetora</p>
                <p>contato@themis.com</p>
                <p>(11) 98765-4321</p>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
        <div class="footer-copyright">
            <p>&copy; 2025 Thémis. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Modal de edição -->
    <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2 id="modalTitle">Editar Usuário</h2>
        <form id="editForm">
            <label class="requiredq">Selecione o usuario</label>
            <select id="selectUsuario"></select>
            <label class="requiredq">Nome </label>
            <input type="text" id="editNome" placeholder="Nome">
            <label class="requiredq">CPF </label>
            <input type="text" id="editCpf" placeholder="CPF">
            <label class="requiredq">Endereço </label>
            <input type="text" id="editEndereco" placeholder="Endereço">
            <label class="requiredq">Telefone </label>
            <input type="text" id="editTelefone" placeholder="Telefone">
            <label class="requiredq">RG </label>
            <input type="text" id="editRg" placeholder="RG">
            <label class="requiredq">Data de Nascimento </label>
            <input type="text" id="editNascimento" placeholder="Nascimento">
            <label class="requiredq">Atribuição </label>
            <select id="editAtribuicao">
                <option value="funcionario">Funcionário</option>
                <option value="aluno">Aluno</option>
                <option value="adm">Administrador</option>
            </select>
            <button type="submit" class="details-button">Salvar</button>
            <button type="button" class="details-button" onclick="closeModal()">Cancelar</button>
            <button type="button" class="details-button" id="deleteButton" style="background:#c00;">Excluir</button>
        </form>
    </div>
</div>
</body>
</html>
